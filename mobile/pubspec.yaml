name: ztm
description: "ZZTech Trace Module"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local Hardware Packages (relative from mobile/ root)
  barcode_scanner:
    path: ../../../libs/barcode_scanner
  rfid_reader:
    path: ../../../libs/rfid_reader

  # Shared Dependencies
  auto_size_text: ^3.0.0
  get: ^4.7.3
  get_storage: ^2.1.1
  http: ^1.6.0
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.0
  scrollable_text: ^0.0.3
  flutter_blue_plus: ^2.3.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/UbuntuMono/UbuntuMono-Regular.ttf
        - asset: assets/fonts/UbuntuMono/UbuntuMono-Italic.ttf
          style: italic
        - asset: assets/fonts/UbuntuMono/UbuntuMono-Bold.ttf
          weight: 700
