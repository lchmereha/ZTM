# Só entra na variante `default`: o container principal serve /ztm/ e repassa
# /ztm-marluvas/ para o container da variante white-label, que roda a mesma
# imagem com VITE_TENANT=marluvas.
#
# A variante é opcional (COMPOSE_PROFILES=marluvas). Com hostname literal no
# proxy_pass, o nginx resolveria `frontend-marluvas` na inicialização e o
# container falharia ao subir sempre que a variante estivesse desligada —
# derrubando o frontend principal junto.
#
# Usar uma variável no proxy_pass adia a resolução para o momento da
# requisição: o nginx sobe normalmente e /ztm-marluvas/ apenas responde erro
# enquanto a variante não estiver no ar.
location /ztm-marluvas/ {
    # DNS embutido do Docker. `valid` limita o cache para o proxy voltar a
    # funcionar sozinho quando a variante subir depois.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $marluvas_upstream http://frontend-marluvas:8080;

    # $request_uri e não uma URI literal: com variável no proxy_pass, o nginx
    # substitui a URI original inteira pela declarada, em vez de trocar só o
    # prefixo do location. Uma URI fixa aqui faria /ztm-marluvas/assets/app.js
    # chegar no upstream como /ztm-marluvas/, quebrando todos os assets.
    # O caminho é idêntico dos dois lados, então repassar o original é correto.
    proxy_pass $marluvas_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Variante desligada devolve 404, não 502: para quem acessa, a rota
    # simplesmente não existe nesta instalação. Sem proxy_intercept_errors,
    # porque o 502 aqui é gerado pelo próprio nginx ao não resolver o host —
    # ligá-lo faria o nginx capturar também erros legítimos vindos do upstream.
    error_page 502 503 504 =404 /ztm-marluvas-indisponivel;
}

location = /ztm-marluvas-indisponivel {
    internal;
    default_type text/plain;
    return 404 "Variante nao implantada nesta instalacao.\n";
}
